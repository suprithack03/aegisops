spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: security-event-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/security-events/**

            - id: incident-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/incidents/**

            - id: ai-investigation-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/investigations/**

server:
  port: 8080